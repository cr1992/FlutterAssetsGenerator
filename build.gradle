buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.commonmark:commonmark:0.21.0'
    }
}

plugins {
    id 'java'
    id "org.jetbrains.intellij" version "1.17.4"
    id 'org.jetbrains.kotlin.jvm' version '1.7.20'
    // Gradle Changelog Plugin
    id 'org.jetbrains.changelog' version "1.3.1"
}

import org.commonmark.parser.Parser
import org.commonmark.renderer.html.HtmlRenderer

apply plugin: 'org.jetbrains.changelog'

String properties(String key) {
    return project.findProperty(key).toString()
}


group = properties("pluginGroup")
version = properties("pluginVersion")

// since-build 213 / 平台 2021.3 要求字节码目标 11 (用 JDK 17 构建时默认会变成 17)
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

compileKotlin {
    kotlinOptions.jvmTarget = "11"
}

compileTestKotlin {
    kotlinOptions.jvmTarget = "11"
}

repositories {
    mavenCentral()
}

dependencies {
    // kotlin-stdlib 由 IDE 平台提供, 不再打进发布包 (见 gradle.properties kotlin.stdlib.default.dependency)
    testImplementation "org.mockito:mockito-core:4.8.0"
    testImplementation "org.mockito:mockito-inline:4.8.0"
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    pluginName = properties("pluginName")

    version = properties("platformVersion")
    type = properties("platformType")
    downloadSources = properties("platformDownloadSources").toBoolean()
    updateSinceUntilBuild = true

    // Plugin Dependencies. Uses `platformPlugins` property from the gradle.properties file.

    plugins = properties("platformPlugins").split(',').toList()
}

// Configure Gradle Changelog Plugin - read more: https://github.com/JetBrains/gradle-changelog-plugin
changelog {
    version = properties("pluginVersion")
    path = "${project.projectDir}/doc/CHANGELOG.md"
//    header = "[${-> version.get()}] - ${new SimpleDateFormat("yyyy-MM-dd").format(new Date())}"
//    headerParserRegex = ~/(\d+\.\d+)/
//    itemPrefix = "-"
    keepUnreleasedSection = true
    unreleasedTerm = "[Unreleased]"
    groups = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
}

runIde {
    // Absolute path to installed target 3.5 Android Studio to use as
    // IDE Development Instance (the "Contents" directory is macOS specific):
//    ideDir.set(file("/Applications/Android Studio.app/Contents"))
}

patchPluginXml {
    version = properties("pluginVersion")
    sinceBuild = properties("pluginSinceBuild")
    untilBuild = properties("pluginUntilBuild")
    
    // Load plugin description from the dedicated README marker block
    pluginDescription = provider {
        def readmeFile = project.file("README.md")
        def descriptionContent = ""

        if (readmeFile.exists()) {
            def readmeContent = readmeFile.text
            def matcher = (readmeContent =~ /(?s)<!-- Plugin description -->(.*?)<!-- Plugin description end -->/)
            if (matcher.find()) {
                descriptionContent = matcher.group(1).trim()
            }
        }
        
        // Convert to HTML using CommonMark
        def parser = Parser.builder().build()
        def renderer = HtmlRenderer.builder().build()
        def document = parser.parse(descriptionContent)
        renderer.render(document)
    }
    
    // Resolve change notes by current pluginVersion first, then fall back to Unreleased
    changeNotes = provider {
        changelog.getOrNull(properties("pluginVersion"))?.toHTML() ?: changelog.getUnreleased().toHTML()
    }
}

runPluginVerifier {
    ideVersions = properties("pluginVerifierIdeVersions").split(',').toList()
    // 本机已安装的 IDE 也一起验证 (可通过 -PpluginVerifierLocalPaths=/path/a,/path/b 覆盖)
    def localIdePaths = project.findProperty("pluginVerifierLocalPaths")
    if (localIdePaths) {
        localPaths = localIdePaths.toString().split(',').collect { file(it.trim()) }
    }
    failureLevel = [
        org.jetbrains.intellij.tasks.RunPluginVerifierTask.FailureLevel.COMPATIBILITY_PROBLEMS,
        org.jetbrains.intellij.tasks.RunPluginVerifierTask.FailureLevel.INVALID_PLUGIN
    ]
}

// 发布到 JetBrains Marketplace: PUBLISH_TOKEN=<token> ./gradlew publishPlugin
publishPlugin {
    token = System.getenv("PUBLISH_TOKEN")
}

test {
    testLogging {
        // 展示测试的输出信息
        showStandardStreams = true
        // 展示具体的测试事件
        events "passed", "skipped", "failed"
    }
}
